name: Build VyreOrbit (full, arm64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [Release, Debug]
        default: Release
      upstream_ref:
        description: "exteraGram tag/commit the patch was made for"
        default: "13.2.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      # The plugin analyzer is downloaded from GitHub during the build; without a token GitHub answers 403 (rate limit)
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4

      - name: Unpack patch from VyreOrbit-build.zip
        run: |
          unzip -q -o VyreOrbit-build.zip -d _pkg
          ls -la _pkg/VyreOrbit-build/patches

      - name: Fetch exteraGram sources (with submodules)
        run: |
          REF="${{ inputs.upstream_ref }}"
          OK=""
          for cand in "$REF" "v$REF"; do
            if git clone --depth 1 --branch "$cand" --recurse-submodules --shallow-submodules \
                 https://github.com/exteraSquad/exteraGram.git src; then OK=1; break; fi
            rm -rf src
          done
          if [ -z "$OK" ]; then
            echo "::error::Tag '$REF' not found in exteraSquad/exteraGram. Run again and enter an existing tag or commit in 'upstream_ref'."
            exit 1
          fi
          cd src
          git apply --binary --whitespace=nowarn ../_pkg/VyreOrbit-build/patches/vyreorbit.patch
          git status --short | head -50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - name: Install SDK, NDK, CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          "$SDKM" "cmake;4.0.2" || "$SDKM" "cmake;3.31.6"

      - name: Preflight checks (fast fail before the long build)
        working-directory: src
        env:
          BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          FAIL=""
          echo "== machine =="
          nproc
          free -g | head -2
          df -h / | tail -1
          MEM_GB=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          if [ "$MEM_GB" -lt 12 ]; then
            echo "::warning::Runner has only ${MEM_GB} GB RAM (private repos get small runners). If the build dies with OutOfMemory, make the repository public: 4 cores and 16 GB RAM."
          fi
          echo "== tools =="
          java -version 2>&1 | head -1
          PYV=$("$BUILD_PYTHON" --version 2>&1)
          echo "$PYV"
          case "$PYV" in "Python 3.11"*) ;; *) echo "::error::Python 3.11 required, got: $PYV"; FAIL=1;; esac
          [ -d "$ANDROID_HOME/ndk/29.0.14206865" ] || { echo "::error::NDK 29.0.14206865 is not installed"; FAIL=1; }
          ls "$ANDROID_HOME/cmake" || { echo "::error::CMake is not installed"; FAIL=1; }
          echo "== submodules =="
          for d in TMessagesProj/jni/td TMessagesProj/jni/third_party/ffmpeg TMessagesProj/jni/third_party/boringssl TMessagesProj/jni/tgcalls TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media; do
            n=$(ls -A "$d" 2>/dev/null | wc -l)
            echo "$d: $n entries"
            [ "$n" -gt 0 ] || { echo "::error::Submodule $d is empty"; FAIL=1; }
          done
          echo "== patch =="
          grep -q '^APP_PACKAGE=app.vyreorbit.messenger' gradle.properties || { echo "::error::Patch was not applied (APP_PACKAGE)"; FAIL=1; }
          grep -q '>VyreOrbit<' TMessagesProj/src/main/res/values/strings.xml || { echo "::error::Patch was not applied (AppName)"; FAIL=1; }
          [ -z "$FAIL" ] || exit 1
          echo "Preflight OK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Create API_KEYS and keystore
        working-directory: src
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for v in APP_ID APP_HASH KEYSTORE_BASE64 SIGNING_KEY_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          case "$APP_ID" in *[!0-9]*) echo "::error::APP_ID must contain digits only"; exit 1;; esac
          [ "${#APP_HASH}" -eq 32 ] || { echo "::error::APP_HASH must be 32 characters (got ${#APP_HASH}). No quotes, no spaces."; exit 1; }
          {
            echo "APP_ID = ${APP_ID}"
            echo "APP_HASH = \"${APP_HASH}\""
            echo "MAPS_V2_API = ${MAPS_V2_API:-none}"
            echo "SIGNING_KEY_PASSWORD = ${SIGNING_KEY_PASSWORD}"
            echo "SIGNING_KEY_ALIAS = ${SIGNING_KEY_ALIAS}"
            echo "SIGNING_KEY_STORE_PASSWORD = ${SIGNING_KEY_STORE_PASSWORD}"
          } > API_KEYS
          mkdir -p TMessagesProj/config
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > TMessagesProj/config/exteraGram.jks
          keytool -list -keystore TMessagesProj/config/exteraGram.jks \
            -storepass "$SIGNING_KEY_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null \
            || { echo "::error::Keystore check failed: wrong KEYSTORE_BASE64, alias or password"; exit 1; }
          echo "Keystore OK"

      - name: Preflight - GitHub API and analyzer release reachable
        run: |
          CODE=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/exteraSquad/plugins-pysdk-builds/releases/latest)
          echo "analyzer releases HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Cannot read exteraSquad/plugins-pysdk-builds releases (HTTP $CODE). The plugin analyzer cannot be downloaded."
            head -c 500 /tmp/rel.json; exit 1
          fi
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit | head -c 300; echo

      - name: Gradle dry run (checks configuration without compiling)
        working-directory: src
        env:
          BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --dry-run :TMessagesProj:assembleFullArm64${{ inputs.build_type }}

      - name: Build
        working-directory: src
        env:
          BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          ./gradlew --no-daemon --stacktrace :TMessagesProj:assembleFullArm64${{ inputs.build_type }}

      - name: Collect APK
        run: |
          mkdir -p out
          find src/TMessagesProj/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: VyreOrbit-full-arm64-${{ inputs.build_type }}
          path: out/*.apk
          if-no-files-found: error
