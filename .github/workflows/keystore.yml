name: Create keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore vyre.jks -storetype PKCS12 \
            -alias vyre -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=VyreOrbit, O=VyreOrbit, C=US" >/dev/null
          mkdir out
          cp vyre.jks out/
          {
            echo "SIGNING_KEY_ALIAS=vyre"
            echo "SIGNING_KEY_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_PASSWORD=$PASS"
            echo
            echo "KEYSTORE_BASE64="
            base64 -w0 vyre.jks
            echo
          } > out/secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vyreorbit-keystore
          path: out/
          retention-days: 1
